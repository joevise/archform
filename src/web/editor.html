<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Archform</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: #0a0e14; color: #d7e0ec; font-family: ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; overflow: hidden; font-size: 13px; }
#app { display: grid; grid-template-rows: 46px 38px 1fr 160px; height: 100vh; }
#topbar { display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #0a0e14; border-bottom: 1px solid #1c2532; }
#topbar .brand { font-weight: 700; letter-spacing: 2px; color: #e8eef7; }
#dot { width: 9px; height: 9px; border-radius: 50%; background: #2dd4bf; display: inline-block; box-shadow: 0 0 8px rgba(45,212,191,.45); }
#dot.bad { background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,.45); }
#fname { color: #5b7395; font-size: 12px; }
#score { font-size: 12px; color: #5b7395; }
.spacer { flex: 1; }
button { background: transparent; color: #c3d0e0; border: 1px solid #26324a; border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 12px; font-family: inherit; letter-spacing: .5px; }
button:hover { border-color: #3b82f6; color: #7fb0f9; }
button.active { background: rgba(59,130,246,.12); border-color: #3b82f6; color: #7fb0f9; }
button:disabled { opacity: .4; cursor: default; }
#lensbar { display: flex; align-items: center; gap: 4px; padding: 0 16px; background: #0a0e14; border-bottom: 1px solid #1c2532; font-size: 12px; color: #5b7395; }
.lens { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 10px; color: #5b7395; letter-spacing: 0; }
.lens:hover { color: #9fb4d0; border-color: #26324a; background: none; }
.lens.active { border-bottom-color: #3b82f6; color: #7fb0f9; background: none; }
#main { display: grid; grid-template-columns: 160px 1fr 300px; min-height: 0; position: relative; }
#palette { background: #0d1117; border-right: 1px solid #1c2532; padding: 10px; overflow-y: auto; }
#palette h3 { font-size: 11px; color: #3d4f6b; margin-bottom: 8px; letter-spacing: 1px; }
.pal-item { border: 1px solid #1c2532; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: grab; background: #0d1420; font-size: 12px; user-select: none; }
.pal-item:hover { border-color: #3b82f6; }
.pal-item .kind-badge { float: right; font-size: 10px; color: #4a5d7d; }
#canvas-wrap { position: relative; min-width: 0; min-height: 0; }
#canvas { width: 100%; height: 100%; display: block; background: #0c1119; cursor: default; }
#zoomctl { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center; background: rgba(10,14,20,.88); border: 1px solid #1c2532; border-radius: 6px; padding: 4px 10px; font-size: 11px; color: #5b7395; }
#inspector { background: #0d1117; border-left: 1px solid #1c2532; padding: 12px; overflow-y: auto; font-size: 12px; }
#inspector h3 { font-size: 11px; color: #3d4f6b; margin-bottom: 10px; letter-spacing: 1px; }
#inspector label { display: block; color: #4a5d7d; font-size: 10px; margin: 8px 0 3px; letter-spacing: .5px; }
#inspector input, #inspector select { width: 100%; background: #0d1420; border: 1px solid #26324a; color: #d7e0ec; border-radius: 4px; padding: 5px 8px; font-size: 12px; font-family: inherit; }
#inspector input:disabled { color: #4a5d7d; }
#inspector .portrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid #131b29; }
#inspector .pdot { width: 9px; height: 9px; border-radius: 50%; }
#inspector .danger { background: rgba(239,68,68,.08); border-color: #7f2d2d; color: #f87171; margin-top: 14px; width: 100%; }
#inspector .danger:hover { border-color: #ef4444; color: #fca5a5; }
#verdict { background: #0a0e14; border-top: 1px solid #1c2532; overflow-y: auto; padding: 8px 14px; font-size: 11.5px; font-family: inherit; }
#verdict .vhead { color: #3d4f6b; margin-bottom: 6px; letter-spacing: 1px; }
#verdict .ok { color: #2dd4bf; }
#verdict .err { color: #f87171; cursor: pointer; padding: 2px 6px; margin: 0 -6px; }
#verdict .err:hover { background: #141d2c; border-radius: 3px; }
#verdict .ruletag { color: #d97706; }
#verdict .sim-ok-line { color: #2dd4bf; padding: 2px 0; }
#verdict .sim-err-line { color: #f87171; padding: 2px 0; }
#yaml-drawer { position: absolute; left: 160px; right: 300px; bottom: 0; height: 45%; background: #080b10; border-top: 2px solid #3b82f6; display: none; flex-direction: column; z-index: 20; }
#yaml-drawer.open { display: flex; }
#yaml-drawer .yd-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 11px; color: #5b7395; border-bottom: 1px solid #1c2532; }
#yaml-text { flex: 1; background: #080b10; color: #c3d0e0; border: none; outline: none; resize: none; padding: 10px; font-family: inherit; font-size: 12px; line-height: 1.6; }
#gen-modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; z-index: 50; }
#gen-modal.open { display: flex; }
#gen-box { width: 640px; max-height: 70vh; overflow-y: auto; background: #0d1117; border: 1px solid #26324a; border-radius: 8px; padding: 16px; }
#gen-box details { margin: 6px 0; }
#gen-box summary { cursor: pointer; color: #7fb0f9; font-size: 12px; }
#gen-box pre { background: #080b10; padding: 8px; border-radius: 4px; font-size: 11px; overflow-x: auto; margin-top: 4px; border: 1px solid #131b29; }
.node-rect { fill: #101826; stroke: #26324a; }
.node.sel .node-rect { stroke: #3b82f6; stroke-width: 2; filter: drop-shadow(0 0 6px rgba(59,130,246,.35)); }
.edge { opacity: .72; }
.edge.sel { stroke-width: 3.2 !important; opacity: 1; }
.edge.err { stroke: #ef4444 !important; stroke-dasharray: 6 4; opacity: 1; }
.port { cursor: crosshair; }
.port.halo { stroke: #f97316; stroke-width: 2.5; r: 9; filter: drop-shadow(0 0 5px rgba(249,115,22,.6)); }
@keyframes flash { 0%,100% { filter: none; } 50% { filter: drop-shadow(0 0 14px #f97316); } }
.flash { animation: flash .5s ease-in-out 3; }
#ghost { position: fixed; pointer-events: none; background: rgba(59,130,246,.92); color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 11px; display: none; z-index: 99; }
.edge.sim-ok { stroke: #f97316 !important; stroke-width: 4 !important; opacity: 1; }
.edge.sim-bad { stroke: #ef4444 !important; stroke-width: 4.5 !important; opacity: 1; }
#toast { position: fixed; left: 50%; bottom: 180px; transform: translateX(-50%); background: #141d2c; border: 1px solid #ef4444; color: #fca5a5; padding: 8px 16px; border-radius: 6px; font-size: 12px; display: none; z-index: 60; }
#toast.show { display: block; }
#legend { position: absolute; right: 10px; top: 10px; background: rgba(10,14,20,.88); border: 1px solid #1c2532; border-radius: 6px; padding: 6px 10px; font-size: 11px; z-index: 10; }
#legend .lg-head { color: #3d4f6b; font-size: 10px; margin-bottom: 4px; letter-spacing: 1px; cursor: pointer; user-select: none; }
#legend.folded .lg-row { display: none; }
#legend .lg-row { display: flex; align-items: center; gap: 7px; padding: 1.5px 0; color: #9fb4d0; }
#legend .lg-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; opacity: .75; }
#policy-drawer { position: absolute; right: 0; top: 0; bottom: 0; width: 300px; background: #0d1117; border-left: 2px solid #3b82f6; display: none; flex-direction: column; z-index: 30; font-size: 12px; }
#policy-drawer.open { display: flex; }
#policy-drawer .pd-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #1c2532; }
#policy-drawer .pd-body { flex: 1; overflow-y: auto; padding: 10px 12px; }
#policy-drawer h4 { font-size: 11px; color: #3d4f6b; margin: 12px 0 6px; letter-spacing: 1px; }
.pd-row { border: 1px solid #1c2532; border-radius: 6px; padding: 8px; margin-bottom: 8px; background: #0d1420; }
.pd-row input, .pd-row select { width: 100%; background: #0a0e14; border: 1px solid #26324a; color: #d7e0ec; border-radius: 4px; padding: 5px 8px; font-size: 11px; margin-bottom: 5px; font-family: inherit; }
.pd-row .pd-del { width: 100%; background: rgba(239,68,68,.08); border-color: #7f2d2d; color: #f87171; font-size: 11px; padding: 3px 0; }
.pd-def-row { display: block; padding: 3px 0; color: #c3d0e0; cursor: pointer; }
.ann-row { display: flex; align-items: center; gap: 7px; padding: 4px 0; border-bottom: 1px solid #131b29; }
.ann-row .ann-tag { margin-left: auto; font-size: 10px; color: #4a5d7d; }
.ann-row.inherited .ann-name { color: #4a5d7d; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="brand">ARCHFORM</span>
    <span id="dot"></span>
    <span id="fname">archform.yaml</span>
    <span id="score"></span>
    <span class="spacer"></span>
    <button id="btn-sim">仿真 ▶</button>
    <button id="btn-gen">生成⚡</button>
    <button id="btn-policy">策略</button>
    <button id="btn-yaml">YAML</button>
  </div>
  <div id="lensbar">
    透镜:
    <button class="lens active" data-lens="拓扑">拓扑</button>
    <button class="lens" data-lens="鉴权">鉴权</button>
    <button class="lens" data-lens="观测">观测</button>
    <button class="lens" data-lens="安全">安全</button>
  </div>
  <div id="main">
    <div id="palette"><h3>积木盒</h3></div>
    <div id="canvas-wrap">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="legend" class="folded"></div>
      <div id="zoomctl"><span id="zoom-label">100%</span><button id="zoom-reset">复位</button></div>
    </div>
    <div id="inspector"><h3>检查器</h3><div id="insp-body" style="color:#6b7280">点击组件或边查看详情</div></div>
    <div id="policy-drawer">
      <div class="pd-head"><b>策略配置</b><span class="spacer"></span><button id="pd-save">保存</button><button id="pd-close">关闭</button></div>
      <div class="pd-body">
        <h4>策略列表（policies）</h4>
        <div id="pd-list"></div>
        <button id="pd-add">+ 新增策略</button>
        <h4>默认继承（defaults.edges）</h4>
        <div id="pd-defaults"></div>
      </div>
    </div>
  </div>
  <div id="yaml-drawer">
    <div class="yd-head"><span>archform.yaml（可编辑）</span><span class="spacer"></span><button id="btn-apply">应用</button><button id="btn-close-yaml">关闭</button></div>
    <textarea id="yaml-text" spellcheck="false"></textarea>
  </div>
  <div id="verdict"><div class="vhead">验证台</div><div id="verdict-body"></div></div>
</div>
<div id="gen-modal"><div id="gen-box"><div style="display:flex;align-items:center"><b>生成结果</b><span class="spacer"></span><button id="gen-close">关闭</button></div><div id="gen-list"></div></div></div>
<div id="ghost"></div>
<div id="toast"></div>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const COLORS = {"sync-call":"#ef4444","event":"#f59e0b","data-store":"#a78bfa","tool-call":"#38bdf8","model-io":"#34d399","stream":"#f472b6"};
const ZH = {"sync-call":"同步调用","event":"异步事件","data-store":"数据存储","tool-call":"工具调用","model-io":"模型I/O","stream":"流式"};
const ZH_SHORT = {"sync-call":"同步","event":"事件","data-store":"数据","tool-call":"工具","model-io":"模型","stream":"流式"};
const KIND_ZH = {"gateway":"网关","service":"工程服务","ai-runtime":"AI运行时","datastore":"数据层","bus":"事件总线","app":"应用","crosscut":"横切服务"};
const PTYPE_ZH = {"auth":"鉴权","trace":"观测","crypto":"加密"};
const LEGEND_HINT = {
  "sync-call":"请求-响应式同步调用",
  "event":"异步消息/事件投递",
  "data-store":"数据读写存储",
  "tool-call":"AI 调用外部工具",
  "model-io":"模型推理输入输出",
  "stream":"流式推送（SSE/WebSocket）"
};
const KIND_PORTS = {
  "gateway": [["api","sync-call","server"],["events","event",null],["chat","stream","server"]],
  "service": [["invoke","sync-call","server"],["emitted","event",null],["store","data-store",null]],
  "ai-runtime": [["invoke","sync-call","server"],["llm","model-io",null],["tools","tool-call",null],["session","data-store",null]],
  "datastore": [["vault","data-store","server"],["admin","sync-call","server"]],
  "bus": [["topic","event","server"]],
  "app": [["backend","sync-call",null],["ui","stream",null]],
  "crosscut": [["invoke","sync-call","server"]]
};
const KINDS = Object.keys(KIND_PORTS);
const NODE_W = 260, NODE_H = 120;

/* 泳道布局：4 条横向泳道 + 右侧横切竖带 */
const LANE_H = 180, LANE_TOP = 40;
const LANES = [
  { name: "应用生态层", kinds: ["app"] },
  { name: "接入层", kinds: ["gateway"] },
  { name: "平台服务层", kinds: ["service", "ai-runtime", "bus"] },
  { name: "数据层", kinds: ["datastore"] }
];
const BAND_X = 1300, BAND_W = 220, BAND_NAME = "横切带";
const WORLD_H = LANE_TOP * 2 + LANES.length * LANE_H;
function laneOf(kind) { for (let i = 0; i < LANES.length; i++) if (LANES[i].kinds.includes(kind)) return i; return -1; }
function laneTop(i) { return LANE_TOP + i * LANE_H; }
function snapPos(kind, x, y) {
  if (kind === "crosscut") {
    return { x: Math.round(BAND_X + (BAND_W - NODE_W) / 2), y: Math.max(LANE_TOP + 6, Math.min(Math.round(y), WORLD_H - LANE_TOP - NODE_H - 6)) };
  }
  const nx = Math.max(6, Math.min(Math.round(x), BAND_X - NODE_W - 12));
  const li = laneOf(kind);
  if (li >= 0) return { x: nx, y: Math.round(laneTop(li) + (LANE_H - NODE_H) / 2) };
  return { x: nx, y: Math.max(LANE_TOP + 6, Math.min(Math.round(y), WORLD_H - LANE_TOP - NODE_H - 6)) };
}

let state = { graph: null, yaml: "", errors: [], lens: "拓扑", sel: null, zoom: 1, pan: {x: 0, y: 0} };
let drag = null;       // {mode:'pan'|'node'|'connect'|'palette', ...}
let tempLine = null;
let haloPorts = [];

const $ = id => document.getElementById(id);
const svg = $("canvas");

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- API ---------- */
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: {"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

async function sync() {
  const s = await api("POST", "/api/serialize", { graph: state.graph });
  state.yaml = s.yaml;
  const r = await api("PUT", "/api/arch", { yaml: state.yaml });
  state.errors = r.errors || [];
  if (r.graph) state.graph = r.graph;
  renderAll();
}

/* ---------- graph helpers ---------- */
function comp(id) { return state.graph.components.find(c => c.id === id); }
function edgeById(id) { return state.graph.edges.find(e => e.id === id); }
function errElements() {
  const m = { comps: new Set(), edges: new Set() };
  for (const e of state.errors) {
    if (edgeById(e.element)) m.edges.add(e.element);
    else if (comp(e.element)) m.comps.add(e.element);
  }
  return m;
}
function portPos(c, portId) {
  const idx = c.ports.findIndex(p => p.id === portId);
  if (idx < 0) return { x: c.x, y: c.y };
  const left = idx % 2 === 0;
  const col = Math.floor(idx / 2);
  return { x: c.x + (left ? 0 : NODE_W), y: c.y + 44 + col * 24 };
}
function edgeGeom(e) {
  const [fc, fp] = e.from.split(".");
  const [tc, tp] = e.to.split(".");
  const c1 = comp(fc), c2 = comp(tc);
  if (!c1 || !c2) return null;
  const p1 = portPos(c1, fp), p2 = portPos(c2, tp);
  const dx = Math.max(40, Math.abs(p2.x - p1.x) / 3);
  const g = { x0: p1.x, y0: p1.y, cx0: p1.x + dx, cy0: p1.y, cx1: p2.x - dx, cy1: p2.y, x1: p2.x, y1: p2.y };
  g.d = "M " + g.x0 + " " + g.y0 + " C " + g.cx0 + " " + g.cy0 + ", " + g.cx1 + " " + g.cy1 + ", " + g.x1 + " " + g.y1;
  return g;
}
function bezPoint(g, t) {
  const u = 1 - t;
  return {
    x: u*u*u*g.x0 + 3*u*u*t*g.cx0 + 3*u*t*t*g.cx1 + t*t*t*g.x1,
    y: u*u*u*g.y0 + 3*u*u*t*g.cy0 + 3*u*t*t*g.cy1 + t*t*t*g.y1
  };
}
function effAnn(e) { return [...(state.graph.defaults.edges || []), ...(e.annotations || [])]; }
function hasDim(e, dim) { return effAnn(e).some(n => state.graph.policies[n] && state.graph.policies[n].ptype === dim); }
function sandboxOf(c) {
  if (c.annotations && c.annotations.sandbox) return c.annotations.sandbox;
  const n = (state.graph.defaults.nodes || {})[c.kind];
  return n && n.sandbox ? n.sandbox : null;
}
function nextId(prefix, taken) { let i = 1; while (taken.has(prefix + "-" + i)) i++; return prefix + "-" + i; }

function toSvgPoint(evt) {
  const r = svg.getBoundingClientRect();
  return { x: (evt.clientX - r.left - state.pan.x) / state.zoom, y: (evt.clientY - r.top - state.pan.y) / state.zoom };
}

/* ---------- render ---------- */
function renderAll() { renderTop(); renderCanvas(); renderInspector(); renderVerdict(); if ($("yaml-drawer").classList.contains("open")) $("yaml-text").value = state.yaml; }

function renderTop() {
  const fail = state.errors.length;
  const pass = state.lastPass != null ? state.lastPass : "";
  $("dot").className = fail ? "bad" : "";
  $("score").textContent = fail ? ("✗ " + fail + " 个错误") : ("✓ " + (pass !== "" ? pass + "/" + pass : "全绿"));
  $("zoom-label").textContent = Math.round(state.zoom * 100) + "%";
}

function renderCanvas() {
  svg.innerHTML = "";
  const vp = el("g", { transform: "translate(" + state.pan.x + "," + state.pan.y + ") scale(" + state.zoom + ")" }, svg);
  const errs = errElements();

  const bg = el("g", {}, vp);
  LANES.forEach((L, i) => {
    el("rect", { x: 0, y: laneTop(i), width: BAND_X, height: LANE_H, fill: i % 2 === 0 ? "#0e1520" : "#111a28", stroke: "#1f2b3f", "stroke-width": 1, "stroke-dasharray": "6 4" }, bg);
    const lt = el("text", { x: 14, y: laneTop(i) + 22, "font-size": 12, fill: "#9db0c9", style: "user-select:none" }, bg);
    lt.textContent = L.name;
  });
  el("rect", { x: BAND_X, y: LANE_TOP, width: BAND_W, height: LANES.length * LANE_H, fill: "#0d1626", stroke: "#1f2b3f", "stroke-width": 1, "stroke-dasharray": "6 4" }, bg);
  const bt = el("text", { x: BAND_X + BAND_W / 2, y: LANE_TOP + 22, "text-anchor": "middle", "font-size": 12, fill: "#9db0c9", style: "user-select:none" }, bg);
  bt.textContent = BAND_NAME;

  const eLayer = el("g", {}, vp);
  for (const e of state.graph.edges) {
    const g = edgeGeom(e);
    if (!g) continue;
    const cls = "edge" + (state.sel && state.sel.type === "edge" && state.sel.id === e.id ? " sel" : "") + (errs.edges.has(e.id) ? " err" : "");
    el("path", { d: g.d, fill: "none", stroke: COLORS[e.etype] || "#6b7280", "stroke-width": 1.8, "class": cls, "data-edge": e.id, style: "cursor:pointer" }, eLayer);
    const mid = bezPoint(g, 0.5);
    const mx = mid.x;
    const my = mid.y;
    if (state.sel && state.sel.type === "edge" && state.sel.id === e.id) {
      const label = el("text", { x: mx, y: my - 8, "text-anchor": "middle", "font-size": 10, fill: "#9fb4d0", "data-edge": e.id, style: "cursor:pointer;user-select:none" }, eLayer);
      label.textContent = ZH[e.etype] || e.etype;
    }
    if (state.lens === "鉴权" || state.lens === "观测") {
      const dim = state.lens === "鉴权" ? "auth" : "trace";
      const okk = hasDim(e, dim);
      el("rect", { x: mx - 9, y: my + 2, width: 18, height: 18, rx: 4, fill: okk ? "#2fae72" : "#ef4444" }, eLayer);
      const t = el("text", { x: mx, y: my + 15, "text-anchor": "middle", "font-size": 11, fill: "#fff", style: "user-select:none" }, eLayer);
      t.textContent = dim === "auth" ? "A" : "T";
    }
  }

  const nLayer = el("g", {}, vp);
  for (const c of state.graph.components) {
    const g = el("g", { "class": "node" + (state.sel && state.sel.type === "comp" && state.sel.id === c.id ? " sel" : ""), "data-comp": c.id, style: "cursor:move" }, nLayer);

  b.querySelectorAll(".err").forEach(n => n.onclick = () => jumpTo(state.errors[+n.dataset.i].element));

function jumpTo(element) {
  let target = null;
  const c = comp(element);
  if (c) target = { x: c.x + NODE_W/2, y: c.y + NODE_H/2 };
  const e = edgeById(element);
  if (!target && e) {
    const c1 = comp(e.from.split(".")[0]);
    if (c1) target = { x: c1.x + NODE_W/2, y: c1.y + NODE_H/2 };
  }
  if (!target) return;
  const r = svg.getBoundingClientRect();
  state.pan = { x: r.width/2 - target.x * state.zoom, y: r.height/2 - target.y * state.zoom };
  renderAll();
  requestAnimationFrame(() => {
    let nodeEl = svg.querySelector(c ? '[data-comp="' + element + '"]' : '[data-edge="' + element + '"]');
    if (nodeEl) { nodeEl.classList.add("flash"); setTimeout(() => nodeEl.classList.remove("flash"), 1600); }
  });
}

function renameComp(oldId, newId) {
  if (!newId || newId === oldId || comp(newId) || edgeById(newId)) { renderAll(); return; }
  const c = comp(oldId); if (!c) return;
  c.id = newId;
  for (const e of state.graph.edges) {
    if (e.from.startsWith(oldId + ".")) e.from = newId + e.from.slice(oldId.length);
    if (e.to.startsWith(oldId + ".")) e.to = newId + e.to.slice(oldId.length);
  }
  state.sel = { type: "comp", id: newId };
  sync();
}

function addComponent(kind, pt) {
  const taken = new Set(state.graph.components.map(c => c.id));
  const id = nextId(kind === "service" ? "svc" : kind, taken);
  const ports = KIND_PORTS[kind].map(([pid, ptype, role]) => ({ id: pid, ptype, role }));
  const sp = snapPos(kind, pt.x - NODE_W / 2, pt.y - 30);
  state.graph.components.push({ id, name: null, kind, x: sp.x, y: sp.y, annotations: {}, ports });
  state.sel = { type: "comp", id };
  sync();

/* ---------- connect ---------- */
function clearHalos() { haloPorts.forEach(n => n.classList.remove("halo")); haloPorts = []; }

function markCompatible(ptype, selfComp) {
  clearHalos();
  svg.querySelectorAll(".port").forEach(n => {
    if (n.dataset.ptype === ptype && n.dataset.comp !== selfComp) { n.classList.add("halo"); haloPorts.push(n); }
  });
}

function portScreenCenter(n) {
  const r = n.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

/* ---------- mouse wiring ---------- */
svg.addEventListener("mousedown", ev => {
  if (sim && sim.playing) { sim.skip = true; return; }
  const t = ev.target;
  if (t.classList && t.classList.contains("port")) {
    ev.preventDefault();
    drag = { mode: "connect", fromComp: t.dataset.comp, fromPort: t.dataset.port, ptype: t.dataset.ptype };
    markCompatible(t.dataset.ptype, t.dataset.comp);
    const vp = svg.firstChild;
    tempLine = el("line", { stroke: "#e5e7eb", "stroke-width": 1.5, "stroke-dasharray": "5 4" }, vp);
    const c = comp(t.dataset.comp); const p = portPos(c, t.dataset.port);
    tempLine.setAttribute("x1", p.x); tempLine.setAttribute("y1", p.y);
    tempLine.setAttribute("x2", p.x); tempLine.setAttribute("y2", p.y);
    return;
  }
  const edgeEl = t.closest ? t.closest("[data-edge]") : null;
  const nodeEl = t.closest ? t.closest("[data-comp]") : null;
  if (nodeEl) {
    const c = comp(nodeEl.dataset.comp);
    drag = { mode: "node", comp: c, start: toSvgPoint(ev), ox: c.x, oy: c.y, moved: false };
  } else if (edgeEl) {
    state.sel = { type: "edge", id: edgeEl.dataset.edge };
    renderAll();
  } else {
    drag = { mode: "pan", sx: ev.clientX, sy: ev.clientY, opx: state.pan.x, opy: state.pan.y, moved: false };
  }
});

window.addEventListener("mousemove", ev => {
  if (!drag) return;
  if (drag.mode === "palette") {
    const gh = $("ghost"); gh.style.left = ev.clientX + 10 + "px"; gh.style.top = ev.clientY + 10 + "px";
  } else if (drag.mode === "pan") {
    if (Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) > 3) drag.moved = true;
    state.pan.x = drag.opx + (ev.clientX - drag.sx);
    state.pan.y = drag.opy + (ev.clientY - drag.sy);
    renderCanvas(); renderTop();
  } else if (drag.mode === "node") {
    const pt = toSvgPoint(ev);
    const sp = snapPos(drag.comp.kind, drag.ox + pt.x - drag.start.x, drag.oy + pt.y - drag.start.y);
    drag.comp.x = sp.x;
    drag.comp.y = sp.y;
    drag.moved = true;
    renderCanvas();
  } else if (drag.mode === "connect" && tempLine) {
    const pt = toSvgPoint(ev);
    tempLine.setAttribute("x2", pt.x); tempLine.setAttribute("y2", pt.y);
  }
});

window.addEventListener("mouseup", ev => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.mode === "palette") {
    $("ghost").style.display = "none";
    const r = svg.getBoundingClientRect();
    if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) addComponent(d.kind, toSvgPoint(ev));
  } else if (d.mode === "pan") {
    if (!d.moved) { state.sel = null; renderAll(); }
  } else if (d.mode === "node") {
    if (!d.moved) { state.sel = { type: "comp", id: d.comp.id }; renderAll(); }
    else sync();
  } else if (d.mode === "connect") {
    if (tempLine) { tempLine.remove(); tempLine = null; }
    let hit = null;
    for (const n of haloPorts) {
      const c = portScreenCenter(n);
      if (Math.hypot(c.x - ev.clientX, c.y - ev.clientY) < 16) { hit = n; break; }
    }
    clearHalos();
    if (hit) {
      const taken = new Set(state.graph.edges.map(e => e.id));
      state.graph.edges.push({
        id: nextId("e", taken),
        from: d.fromComp + "." + d.fromPort,
        to: hit.dataset.comp + "." + hit.dataset.port,
        etype: d.ptype,
        spec: null,
        annotations: []
      });
      sync();
    } else renderCanvas();
  }
});

svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const old = state.zoom;
  state.zoom = Math.min(2.5, Math.max(0.3, state.zoom * (ev.deltaY < 0 ? 1.1 : 0.9)));
  state.pan.x = mx - (mx - state.pan.x) * (state.zoom / old);
  state.pan.y = my - (my - state.pan.y) * (state.zoom / old);
  renderCanvas(); renderTop();
}, { passive: false });

$("zoom-reset").onclick = () => fitView();

function fitView() {
  if (!state.graph || !state.graph.components || !state.graph.components.length) return;
  const CW = 260, CH = 120, pad = 70;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const c of state.graph.components) {
    minX = Math.min(minX, c.x); minY = Math.min(minY, c.y);
    maxX = Math.max(maxX, c.x + CW); maxY = Math.max(maxY, c.y + CH);
  }
  const r = svg.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  const zw = (r.width - pad * 2) / (maxX - minX || 1);
  const zh = (r.height - pad * 2) / (maxY - minY || 1);
  state.zoom = Math.max(0.3, Math.min(zw, zh, 1.5));
  state.pan = {
    x: (r.width - (maxX - minX) * state.zoom) / 2 - minX * state.zoom,
    y: (r.height - (maxY - minY) * state.zoom) / 2 - minY * state.zoom
  };
  renderCanvas(); renderTop();
}

let pdState = null;

function openPolicyDrawer() {
  pdState = {
    policies: Object.entries(state.graph.policies || {}).map(([name, p]) => ({ name, ptype: p.ptype, scheme: p.scheme || "", pdp: p.pdp || "" })),
    defaults: [...(state.graph.defaults.edges || [])]
  };
  renderPolicyDrawer();
  $("policy-drawer").classList.add("open");
}

function renderPolicyDrawer() {
  const list = $("pd-list");
  list.innerHTML = "";
  pdState.policies.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "pd-row";
    row.innerHTML =
      '<input class="pd-name" placeholder="名称" value="' + esc(p.name) + '">' +
      '<select class="pd-ptype">' + ["auth", "trace", "crypto"].map(t => '<option value="' + t + '"' + (p.ptype === t ? " selected" : "") + '>' + t + ' · ' + (PTYPE_ZH[t] || t) + '</option>').join("") + '</select>' +
      '<input class="pd-scheme" placeholder="scheme（如 jwt-bearer）" value="' + esc(p.scheme) + '">' +
      '<select class="pd-pdp"><option value="">pdp: 无</option>' +
      state.graph.components.map(c => '<option value="' + esc(c.id) + '"' + (p.pdp === c.id ? " selected" : "") + '>' + esc(c.name || c.id) + '</option>').join("") + '</select>' +
      '<button class="pd-del">删除</button>';
    row.querySelector(".pd-name").onchange = ev => {
      const old = p.name;
      p.name = ev.target.value;
      const di = pdState.defaults.indexOf(old);
      if (di >= 0) pdState.defaults[di] = p.name;
      renderPolicyDrawer();
    };
    row.querySelector(".pd-ptype").onchange = ev => { p.ptype = ev.target.value; };
    row.querySelector(".pd-scheme").oninput = ev => { p.scheme = ev.target.value; };
    row.querySelector(".pd-pdp").onchange = ev => { p.pdp = ev.target.value; };
    row.querySelector(".pd-del").onclick = () => {
      pdState.policies.splice(i, 1);
      pdState.defaults = pdState.defaults.filter(n => n !== p.name);
      renderPolicyDrawer();
    };
    list.appendChild(row);
  });
  const dd = $("pd-defaults");
  dd.innerHTML = "";
  pdState.policies.forEach(p => {
    if (!p.name.trim()) return;
    const lab = document.createElement("label");
    lab.className = "pd-def-row";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = pdState.defaults.includes(p.name);
    cb.onchange = () => {
      if (cb.checked) { if (!pdState.defaults.includes(p.name)) pdState.defaults.push(p.name); }
      else pdState.defaults = pdState.defaults.filter(n => n !== p.name);
    };
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(" " + p.name + "（" + (PTYPE_ZH[p.ptype] || p.ptype) + "）"));
    dd.appendChild(lab);
  });
}

$("btn-policy").onclick = openPolicyDrawer;
$("pd-add").onclick = () => { pdState.policies.push({ name: "", ptype: "auth", scheme: "", pdp: "" }); renderPolicyDrawer(); };
$("pd-close").onclick = () => $("policy-drawer").classList.remove("open");
$("pd-save").onclick = async () => {
  const pol = {};
  for (const p of pdState.policies) {
    const n = p.name.trim();
    if (!n) continue;
    pol[n] = { ptype: p.ptype };
    if (p.scheme.trim()) pol[n].scheme = p.scheme.trim();
    if (p.pdp) pol[n].pdp = p.pdp;
  }
  state.graph.policies = pol;
  const valid = new Set(Object.keys(pol));
  state.graph.defaults.edges = pdState.defaults.filter(n => valid.has(n));
  $("policy-drawer").classList.remove("open");
  await sync();
};

function simWait(ms) {
  return new Promise(res => {
    if (sim.skip || ms <= 0) return res();
    const t0 = performance.now();
    (function f(now) { if (sim.skip || now - t0 >= ms) res(); else requestAnimationFrame(f); })(performance.now());
  });
}

function compCenter(id) {
  const c = comp(id);
  return c ? { x: c.x + NODE_W / 2, y: c.y + NODE_H / 2 } : null;
}

async function simPulse(ov, p) {
  if (sim.skip) return;
  const ring = el("circle", { cx: p.x, cy: p.y, r: 40, fill: "none", stroke: "#f97316", "stroke-width": 3, opacity: 0.9 }, ov);
  const t0 = performance.now();
  await new Promise(res => {
    (function f(now) {
      const t = Math.min(1, (now - t0) / 500);
      ring.setAttribute("r", 40 + 50 * t);
      ring.setAttribute("opacity", 0.9 * (1 - t));
      if (sim.skip || t >= 1) res(); else requestAnimationFrame(f);
    })(performance.now());
  });
  ring.remove();
}

async function simHop(g, dot, glow) {
  const setPos = p => {
    dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y);
    glow.setAttribute("cx", p.x); glow.setAttribute("cy", p.y);
  };
  if (sim.skip) { setPos(bezPoint(g, 1)); return; }
  const t0 = performance.now();
  await new Promise(res => {
    (function f(now) {
      const t = sim.skip ? 1 : Math.min(1, (now - t0) / 600);
      setPos(bezPoint(g, t));
      if (t >= 1) res(); else requestAnimationFrame(f);
    })(performance.now());
  });
}

async function simFlashRed(dot, glow) {
  dot.setAttribute("fill", "#ef4444");
  glow.setAttribute("fill", "#ef4444");
  for (let i = 0; i < 3; i++) {
    dot.setAttribute("opacity", 0.15);
    await simWait(150);
    dot.setAttribute("opacity", 1);
    await simWait(150);
  }
}

async function playSim(r) {
  const vp = svg.firstChild;
  if (!vp) return;
  const old = svg.querySelector("#sim-overlay");
  if (old) old.remove();
  svg.querySelectorAll(".sim-ok,.sim-bad").forEach(n => n.classList.remove("sim-ok", "sim-bad"));
  const ov = el("g", { id: "sim-overlay", "pointer-events": "none" }, vp);
  const glow = el("circle", { r: 13, fill: "#f97316", opacity: 0.3 }, ov);
  const dot = el("circle", { r: 7, fill: "#f97316" }, ov);
  const start = compCenter((r.entry || "").split(".")[0]) || { x: 0, y: 0 };
  glow.setAttribute("cx", start.x); glow.setAttribute("cy", start.y);
  dot.setAttribute("cx", start.x); dot.setAttribute("cy", start.y);
  let stalled = null;
  for (const s of (r.steps || [])) {
    if (s.step === "enter") {
      const p = compCenter(s.element.split(".")[0]);
      if (p) { dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y); glow.setAttribute("cx", p.x); glow.setAttribute("cy", p.y); }
      await simWait(300);
    } else if (s.step === "process") {
      const p = compCenter(s.element);
      if (p) await simPulse(ov, p);
    } else if (s.step === "hop") {
      const e = edgeById(s.element);
      const g = e && edgeGeom(e);
      if (g) {
        await simHop(g, dot, glow);
        const pe = svg.querySelector('path[data-edge="' + s.element + '"]');
        if (pe) { pe.classList.add("sim-ok"); sim.litEdges.push(pe); }
      }
    } else if (s.step === "stall") {
      stalled = s;
      const pe = s.element !== "-" && svg.querySelector('path[data-edge="' + s.element + '"]');
      if (pe) pe.classList.add("sim-bad");
      await simFlashRed(dot, glow);
      verdictLine('<span class="ruletag">[simulate]</span> ' + esc(s.element) + " " + esc(s.message || ""), "sim-err-line");
      toast("仿真卡在 " + s.element);
      break;
    } else if (s.step === "done") {
      break;
    }
  }
  if (stalled || !r.ok) {
    const el2 = stalled ? stalled.element : "-";
    verdictLine("❌ 仿真卡在 " + esc(el2), "sim-err-line");
  } else {
    if (sim.skip) { dot.setAttribute("opacity", 0); glow.setAttribute("opacity", 0); }
    else {
      const t0 = performance.now();
      await new Promise(res => {
        (function f(now) {
          const t = Math.min(1, (now - t0) / 400);
          dot.setAttribute("opacity", 1 - t);
          glow.setAttribute("opacity", 0.3 * (1 - t));
          if (sim.skip || t >= 1) res(); else requestAnimationFrame(f);
        })(performance.now());
      });
    }
    ov.remove();
    verdictLine("✅ 仿真完成：入口 " + esc(r.entry) + "，" + r.hops + " 跳全通", "sim-ok-line");
    const lit = sim.litEdges.slice();
    setTimeout(() => lit.forEach(n => n.classList.remove("sim-ok")), 5000);
  }
}

$("btn-sim").onclick = async () => {
  if (sim && sim.playing) return;
  const btn = $("btn-sim");
  btn.disabled = true;
  btn.textContent = "仿真中…";
  sim = { playing: true, skip: false, litEdges: [] };
  try {
    const r = await api("POST", "/api/simulate", { yaml: state.yaml });
    await playSim(r);
  } catch (e) {
    verdictLine("❌ 仿真请求失败: " + esc(e.message || e), "sim-err-line");
  } finally {
    sim.playing = false;
    btn.disabled = false;
    btn.textContent = "仿真 ▶";
  }
};

/* ---------- boot ---------- */
(async function boot() {
  renderPalette();
  renderLegend();
  const r = await api("GET", "/api/arch");
  state.yaml = r.yaml;
  state.graph = r.graph;
  const v = await api("POST", "/api/validate", { yaml: state.yaml });
  state.errors = v.errors || [];
  state.lastPass = v.pass;
  renderAll();
  fitView();
})();
</script>
</body>
